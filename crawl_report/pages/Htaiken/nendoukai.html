<P><CENTER><FONT SIZE="+1" COLOR="#1979BA">　</FONT></CENTER></P>

<P><FONT SIZE="+1"
COLOR="#FFFFFF">ハイ、もちろん「念動力」でも何でもありません。</FONT>
</P>

<P><FONT SIZE="+1"
COLOR="#FFFFFF">お札の掌（てのひら）に触れている側の繊維が、手から出ている水分を吸って膨張して伸びます。それにより、掌に触れてない側の繊維との膨張差が生じ、お札が反ります。</FONT>
</P>

<P><FONT SIZE="+1"
COLOR="#FFFFFF">うまくいかないときは、掌をこすり、暖めることでうまくいくこともあります。</FONT>
</P>

<P><FONT SIZE="+1"
COLOR="#FFFFFF">反ったお札を裏返しにしてやると、徐々に元に戻り、反対側に反るようになります。</FONT>
</P>

<P><FONT SIZE="+1" COLOR="#FFFFFF">　</FONT></P>

<P><FONT SIZE="+1"
COLOR="#FFFFFF">誰かの掌に置いて、パワーを送っているふりをして、お札を曲げるという演出の仕方もあります。</FONT>
</P>
