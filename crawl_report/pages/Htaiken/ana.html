<P><FONT SIZE="+1"
COLOR="#1979BA">四角い紙を２枚用意して下さい。</FONT></P>

<P><FONT SIZE="+1"
COLOR="#1979BA">１枚目に小さい穴を１つ、針で開けて下さい。</FONT>
</P>

<P><FONT SIZE="+1"
COLOR="#1979BA">もう１枚は２ミリずつ離して、３個の穴を開けます。</FONT>
</P>

<P><CENTER><FONT SIZE="+1" COLOR="#1979BA"><IMG SRC="akekata.gif"

<P><FONT SIZE="+1"
COLOR="#1979BA">１個の穴から３個の穴の開いた紙を覗くと、穴は当然、３個に見えますよね。</FONT>
</P>

<P><FONT SIZE="+1" COLOR="#1979BA">では、</FONT><B><FONT SIZE="+1"
COLOR="#1979BA">逆に、３個穴の開いた紙から１個の穴の開いた紙を覗いてみて下さい。</FONT></B>
</P>

</P>

<P><FONT SIZE="+1"
COLOR="#1979BA">（電灯や蛍光灯の光にかざしながら見てみて下さい）</FONT>
