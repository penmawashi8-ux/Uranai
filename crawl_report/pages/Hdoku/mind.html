<P>まず、10円、100円、500円を用意してください。</P>

<P>その後は下の手順通りにお金を動かしていって下さい。</P>

<P>あなたの心をあやつります！？</P>

<P>　</P>

<P>適当に3つを横に並べてください。</P>

<P>　</P>

<P>100円を左のお金といれかえてください。</P>

<P>（できないときはそのまま）</P>

<P>　</P>

<P>500円を右のお金といれかえてください。</P>

<P>（できないときはそのまま）</P>

<P>　</P>

<P>10円を左のお金といれかえてください。</P>

<P>（できないときはそのまま）</P>

<P>　</P>

<P>一番右のお金を右手ににぎってください。</P>

<P>　</P>

<P>残ったお金のうち安い方を左手ににぎってください。</P>

<P>　</P>
