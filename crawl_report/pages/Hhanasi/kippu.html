<P><FONT SIZE="+1">○</FONT><FONT SIZE="+2">増える切符</FONT></P>

<P><FONT SIZE="+1">　</FONT></P>

<P><FONT
SIZE="+1">これはある日本人がアメリカで旅行していたときの話です。その人がニューヨークへ行こうとして駅で「To　ニューヨーク」と切符を注文したところ、ニューヨーク行きの切符が2枚渡された。「Two　ニューヨーク」と聞き間違えたらしい。そこで、「For
　ニューヨーク」と言い直すと、今度はニューヨーク行きの切符が4枚渡された。で、どうしていいか分からず「えーっとー」と悩んでいたら今度は切符を8枚渡された。</FONT>
</P>
